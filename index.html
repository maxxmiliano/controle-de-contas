<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1116" />
    <title>Meu Rendimento Driver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app">
        <header class="topo">
            <div>
                <p class="topo-saudacao" id="saudacao">Boa noite</p>
                <h1 class="topo-titulo">Meu Rendimento</h1>
            </div>
            <span class="topo-data" id="dataHoje"></span>
        </header>

        <main>
            <!-- ===== INÍCIO ===== -->
            <section class="tela ativa" id="tela-inicio">
                <div class="card-saldo">
                    <p class="rotulo">Saldo atual</p>
                    <p class="saldo-valor" id="saldoAtual">R$ 0,00</p>
                    <div class="saldo-linha">
                        <div>
                            <span class="ponto ponto-ganho"></span>
                            <span class="rotulo">Ganhos</span>
                            <strong id="totalGanhos">R$ 0,00</strong>
                        </div>
                        <div>
                            <span class="ponto ponto-gasto"></span>
                            <span class="rotulo">Gastos</span>
                            <strong id="totalGastos">R$ 0,00</strong>
                        </div>
                    </div>
                </div>

                <div class="acoes">
                    <button class="acao acao-ganho" data-abrir="ganho">
                        <span class="acao-icone">+</span> Ganho
                    </button>
                    <button class="acao acao-gasto" data-abrir="gasto">
                        <span class="acao-icone">−</span> Gasto
                    </button>
                </div>

                <div class="bloco">
                    <div class="bloco-cabeca">
                        <h2>Próximas contas</h2>
                        <button class="link" data-ir="contas">Ver todas</button>
                    </div>
                    <ul class="lista" id="proximasContas"></ul>
                </div>

                <div class="bloco">
                    <div class="bloco-cabeca">
                        <h2>Últimos lançamentos</h2>
                        <button class="link" data-ir="historico">Ver tudo</button>
                    </div>
                    <ul class="lista" id="ultimosRegistros"></ul>
                </div>
            </section>

            <!-- ===== HISTÓRICO ===== -->
            <section class="tela" id="tela-historico">
                <h2 class="tela-titulo">Histórico</h2>
                <ul class="lista" id="listaRegistros"></ul>
            </section>

            <!-- ===== CONTAS ===== -->
            <section class="tela" id="tela-contas">
                <div class="bloco-cabeca">
                    <h2 class="tela-titulo">Minhas contas</h2>
                    <button class="botao-pequeno" data-abrir="conta">+ Conta</button>
                </div>
                <ul class="lista" id="listaContas"></ul>
            </section>
        </main>

        <!-- ===== NAVEGAÇÃO ===== -->
        <nav class="nav">
            <button class="nav-item ativo" data-ir="inicio">
                <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
                Início
            </button>
            <button class="nav-item" data-ir="historico">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                Histórico
            </button>
            <button class="nav-item" data-ir="contas">
                <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
                Contas
            </button>
        </nav>
    </div>

    <!-- ===== FORMULÁRIO (folha que sobe) ===== -->
    <div class="fundo" id="fundo" hidden></div>
    <form class="folha" id="folha" hidden autocomplete="off">
        <div class="folha-alca"></div>
        <h3 id="folhaTitulo">Registrar</h3>

        <label class="campo campo-valor">
            <span>Valor</span>
            <div class="valor-entrada">
                <em>R$</em>
                <input type="number" id="campoValor" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required />
            </div>
        </label>

        <label class="campo" id="grupoNome">
            <span id="rotuloNome">Descrição</span>
            <input type="text" id="campoNome" maxlength="60" />
        </label>

        <label class="campo" id="grupoData">
            <span id="rotuloData">Data</span>
            <input type="date" id="campoData" />
        </label>

        <p class="erro" id="erroForm" hidden></p>

        <div class="folha-botoes">
            <button type="button" class="botao-secundario" id="cancelar">Cancelar</button>
            <button type="submit" class="botao-principal" id="salvar">Salvar</button>
        </div>
    </form>

    <div class="aviso" id="aviso" hidden></div>

    <script src="src/script.js"></script>
</body>

</html>
